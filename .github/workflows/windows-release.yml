name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run analyze and tests before packaging
        type: boolean
        required: false
        default: false

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up cached Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Configure Flutter
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Analyze and test
        if: ${{ inputs.run_checks }}
        shell: pwsh
        run: |
          flutter analyze
          flutter test

      - name: Set up cached FFmpeg
        id: setup-ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64
          linking-type: static
          github-token: ${{ github.token }}

      - name: Build transferable Windows package
        shell: pwsh
        run: |
          $ffmpegPath = Join-Path '${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}' 'ffmpeg.exe'
          .\scripts\Package-Windows.ps1 -FfmpegPath $ffmpegPath

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChurchStreamer-Windows-x64
          path: dist/ChurchStreamer-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
